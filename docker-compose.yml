version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cake
      POSTGRES_PASSWORD: cake
      POSTGRES_DB: cake_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
